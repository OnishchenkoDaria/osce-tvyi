<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Сторінку не знайдено — Простори підтримки «Твій»</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; background: #F2F3F8; color: #444655;
      font-family: Ubuntu, "Source Sans 3", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    main { max-width: 520px; }
    .code { font-size: 96px; font-weight: 700; line-height: 1; color: #5f74ff; margin: 0 0 8px; }
    h1 { font-size: 26px; margin: 0 0 12px; font-family: Ubuntu, system-ui, sans-serif; }
    p { margin: 0 0 28px; color: #7E7E83; font-size: 18px; line-height: 1.5; }
    a {
      display: inline-block; padding: 14px 28px; border-radius: 8px; background: #5f74ff;
      color: #fff; text-decoration: none; font-weight: 600; font-size: 17px;
    }
    a:hover, a:focus-visible { background: #344BD7; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, адресу введено з помилкою або сторінку було переміщено.</p>
    <a href="/">Повернутися на головну</a>
  </main>
</body>
</html>
