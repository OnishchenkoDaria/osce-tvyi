# Builds the site and uploads dist/ to the Hetzner shared hosting over FTPS.
# Manual trigger only (workflow_dispatch) until the production switch is approved.
name: Deploy to Hetzner (FTP)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        default: test
        options: [test, production]

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          # test -> https://tviy.org.ua/test/ ; production -> https://tviy.org.ua/
          VITE_BASE: ${{ inputs.target == 'production' && '/' || '/test/' }}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ inputs.target == 'production' && '/' || '/test/' }}
          # never touch the old landing copy or the test folder when deploying to the root
          exclude: |
            **/.git*
            **/.git*/**
            info/**
            test/**
